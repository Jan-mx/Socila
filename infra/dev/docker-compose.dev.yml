# 本地演练库：阶段01~06 的 migration 空库重建、集成测试与对账演练使用。
# 生产单机 Compose 在阶段07按 REL-FR-001 另建，不复用本文件。
# 凭据不落仓库：密码从同目录 .env 读取（.gitignore 的 .env* 已覆盖），
# 首次启动前生成：SSP_PG_DEV_PASSWORD=$(openssl rand -hex 16) 写入 infra/dev/.env。
# 端口固定映射 5433，避免与本机任何既有 PostgreSQL 冲突。
services:
  postgres:
    image: postgres:17-alpine
    container_name: ssp-pg-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SSP_PG_DEV_PASSWORD:?需要在 infra/dev/.env 设置 SSP_PG_DEV_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - ssp-pg-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ssp-pg-dev-data:
