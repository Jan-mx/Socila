# 阶段01.6 CI 门禁（FND-FR-009 / FND-FR-010）
# 全套门禁：依赖安装 → 源码Lint → 类型检查 → 测试 → 生产构建 → 全库 Secret 扫描。
# 排除规则：Lint 仅作用于 src/（本地评估脚本目录不在其内且不入库）；
# Secret 扫描覆盖全部跟踪文件；构建使用占位配置，不依赖真实数据库与模型密钥
# （FND-AC-004，PRD §9：真实密钥只存在部署环境）。
name: CI

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      NEXTAUTH_SECRET: ci-placeholder-secret-not-real
      NEXTAUTH_URL: http://localhost:3000
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD_HASH: $2a$12$abcdefghijklmnopqrstuv0123456789012345678901234567890
      OPENAI_URL: ""
      OPENAI_API_KEY: ci-placeholder-key-not-real
      OPENAI_MODEL: gpt-4o-mini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint src
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: node scripts/scan-secrets.mjs --all
