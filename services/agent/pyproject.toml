[project]
name = "policyops-agent"
version = "0.1.0"
description = "PolicyOps Agent Runtime (Stage 04): FastAPI control plane + Celery + LangGraph skeleton"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "psycopg[binary,pool]>=3.1",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=1.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires local drill PostgreSQL/Redis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
